name: RDP

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "No IP from Tailscale"
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Send RDP Info to Telegram
        shell: pwsh
        run: |
          $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          $chat_id = "${{ secrets.TELEGRAM_CHAT_ID }}"

          $ip = "$env:TAILSCALE_IP"
          $user = "RDP"
          $pass = "$env:RDP_PASSWORD"

          $text = @"
🖥️ <b>RDP SYSTEM ONLINE</b>

━━━━━━━━━━━━━━
🌐 <b>Dirección IP:</b>
<code>$ip</code>

👤 <b>Usuario:</b>
<code>$user</code>

🔑 <b>Contraseña:</b>
<code>$pass</code>

⏱ <b>Duración:</b>
<code>5:50h</code>
━━━━━━━━━━━━━━
"@

          Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/sendMessage" `
            -Method Post `
            -Body @{
              chat_id = $chat_id
              text = $text
              parse_mode = "HTML"
            }

      - name: Maintain and Restart (5h 50m)
        shell: pwsh
        run: |
          Start-Sleep -Seconds 21000

          $repo = "${{ github.repository }}"
          $token = "${{ secrets.GITHUB_TOKEN }}"

          $body = @{
            ref = "${{ github.ref_name }}"
          } | ConvertTo-Json

          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/$repo/actions/workflows/${{ github.workflow }}.yml/dispatches" `
            -Headers @{
              Authorization = "Bearer $token"
              Accept = "application/vnd.github+json"
            } `
            -Body $body

      - name: Notify Completion
        if: always()
        shell: pwsh
        run: |
          $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          $chat_id = "${{ secrets.TELEGRAM_CHAT_ID }}"

          $status = "${{ job.status }}"

          if ($status -eq "success") {
            $msg = "✅ <b>RDP FINALIZADO</b>`nEl workflow ha terminado correctamente."
          } else {
            $msg = "⚠️ <b>RDP FINALIZADO CON ERROR</b>`nRevisa los logs del workflow."
          }

          Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/sendMessage" `
            -Method Post `
            -Body @{
              chat_id = $chat_id
              text = $msg
              parse_mode = "HTML"
            }
